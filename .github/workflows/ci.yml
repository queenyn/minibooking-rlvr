name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run full unit test suite
        run: python -X utf8 -m pytest -v

      - name: Verify byte-identical frozen dataset reproducibility
        run: python -X utf8 scripts/generate_dataset.py --check

      - name: Run CPU planning baseline sanity check (oracle & null)
        run: python -X utf8 scripts/run_planning_eval.py --split dev --predictors oracle null --no-save
